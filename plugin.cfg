[AUTHOR]
# Identifies the plugin author or team. NEVER change NAME or EMAIL after the
# first release - LoxBerry uses these values to identify your plugin across updates.
NAME=Fabian Franzmann
EMAIL=fabian.franzmann@gmail.com

[PLUGIN]
# The version of this plugin release. Use semantic versioning (MAJOR.MINOR.PATCH).
VERSION=1.0.0

# Short technical name used for script filenames in daemon/ and cron/.
NAME=panasonictv

# The preferred installation subfolder name.
FOLDER=panasonictv

# Human-readable display name of the plugin (max 25 characters).
TITLE=Panasonic TV

# URL of the plugin homepage or developer website (optional).
WEBSITE=https://github.com/challo2018/LoxBerry-Plugin-PanasonicTV

# Initial loglevel for LoxBerry native logging (1=Error, 2=Error, 3=Error, 4=Warning, 6=Info, 7=Debug)
LOGLEVEL=6

[AUTOUPDATE]
# Automatic updates via LoxBerry update mechanism
AUTOMATIC_UPDATES=false
RELEASECFG=https://raw.githubusercontent.com/challo2018/LoxBerry-Plugin-PanasonicTV/main/release.cfg
PRERELEASECFG=https://raw.githubusercontent.com/challo2018/LoxBerry-Plugin-PanasonicTV/main/prerelease.cfg

[SYSTEM]
# Prompt user to reboot after installation? (false = no reboot needed)
REBOOT=false

# Minimum LoxBerry version required
LB_MINIMUM=3.0.0
LB_MAXIMUM=false

# Restrict installation to specific hardware architectures (false = all)
ARCHITECTURE=false

# If true, the Plugin Management Widget shows a loglevel selector.
CUSTOM_LOGLEVELS=true

# Plugin Interface version
INTERFACE=2.0
